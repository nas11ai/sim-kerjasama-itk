# ─────────────────────────────────────────
# Konfigurasi Laravel bersama untuk app, queue, reverb, scheduler. Nilai di sini menimpa .env
# supaya setiap proses memakai sesi, antrean, dan broadcast yang sama.
# ─────────────────────────────────────────
x-laravel-env: &laravel-env
    # Ziggy membangun URL absolut dari APP_URL; tanpa port, link frontend mengarah ke port 80.
    APP_URL: http://localhost:${APP_PORT:-8000}
    # Unggahan pribadi selalu di disk `local` (W15); MinIO opsional (profil `s3`).
    FILESYSTEM_DISK: local
    DB_CONNECTION: pgsql
    DB_HOST: postgres
    DB_PORT: 5432
    DB_DATABASE: ${DB_DATABASE:-simpas}
    DB_USERNAME: ${DB_USERNAME:-simpas}
    DB_PASSWORD: ${DB_PASSWORD:-secret}
    REDIS_HOST: dragonfly
    REDIS_PORT: 6379
    MINIO_ENDPOINT: http://minio:9000
    # BR-IAM-21, W60 — kehadiran dan "Akhiri Semua Sesi" membaca tabel `sessions`.
    SESSION_DRIVER: database
    SESSION_LIFETIME: ${SESSION_LIFETIME:-120}
    # W169 — broadcast diantrekan; `sync` membuat Reverb yang mati menggagalkan request.
    QUEUE_CONNECTION: database
    # Throttle session.active (BroadcastSessionActivity) dibagi antar proses web.
    CACHE_STORE: database
    BROADCAST_CONNECTION: reverb
    REVERB_APP_ID: ${REVERB_APP_ID:-simpas-local}
    REVERB_APP_KEY: ${REVERB_APP_KEY:-simpas-local-key}
    REVERB_APP_SECRET: ${REVERB_APP_SECRET:-simpas-local-secret}
    # Server (worker antrean) menerbitkan ke service reverb; browser memakai port yang dipublikasikan.
    REVERB_HOST: reverb
    REVERB_PORT: 8080
    REVERB_SCHEME: http
    VITE_REVERB_APP_KEY: ${REVERB_APP_KEY:-simpas-local-key}
    VITE_REVERB_HOST: ${VITE_REVERB_HOST:-localhost}
    VITE_REVERB_PORT: ${REVERB_PORT:-8080}
    VITE_REVERB_SCHEME: ${VITE_REVERB_SCHEME:-http}

# Proses artisan jangka panjang: image yang sama, tanpa entrypoint pemasang dependency
# (hanya `app` yang memasang, supaya tidak ada composer install paralel).
x-laravel-worker: &laravel-worker
    build:
        context: .
        dockerfile: Dockerfile
    restart: unless-stopped
    entrypoint: ['php', 'artisan']
    environment: *laravel-env
    volumes:
        - .:/var/www/html
    depends_on:
        app:
            condition: service_healthy

services:
    # ─────────────────────────────────────────
    # PostgreSQL — Primary Database
    # ─────────────────────────────────────────
    postgres:
        image: postgres:18-alpine
        container_name: simpas_postgres
        restart: unless-stopped
        environment:
            POSTGRES_DB: ${DB_DATABASE:-simpas}
            POSTGRES_USER: ${DB_USERNAME:-simpas}
            POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
        # Bukan DB_PORT: .env memakai DB_PORT untuk PostgreSQL test (55432) dan port itu bentrok.
        ports:
            - '${COMPOSE_DB_PORT:-5433}:5432'
        volumes:
            - postgres_data:/var/lib/postgresql
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U ${DB_USERNAME:-simpas} -d ${DB_DATABASE:-simpas}']
            interval: 10s
            timeout: 5s
            retries: 5

    # ─────────────────────────────────────────
    # Dragonfly — Redis-compatible Cache & Queue
    # ─────────────────────────────────────────
    dragonfly:
        image: docker.dragonflydb.io/dragonflydb/dragonfly:v1.27.1
        container_name: simpas_dragonfly
        restart: unless-stopped
        # Default-nya satu thread per core × 256 MB (12 core = 3 GB) dan menolak start di WSL yang sempit.
        command: ['--proactor_threads=2', '--maxmemory=512mb']
        ulimits:
            memlock: -1
        ports:
            - '${REDIS_PORT:-6379}:6379'
        volumes:
            - dragonfly_data:/data
        healthcheck:
            test: ['CMD', 'redis-cli', 'ping']
            interval: 10s
            timeout: 5s
            retries: 5

    # ─────────────────────────────────────────
    # MinIO — S3-compatible Local File Storage
    # ─────────────────────────────────────────
    # MinIO berhenti menerbitkan image publik (tag ini hilang dari Docker Hub dan Quay), jadi
    # service ini hanya jalan dengan `--profile s3` dan image yang tersedia bagimu.
    minio:
        profiles: ['s3']
        image: minio/minio:RELEASE.2024-05-10T01-41-38Z
        container_name: simpas_minio
        restart: unless-stopped
        command: server /data --console-address ":9001"
        environment:
            MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
            MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
        ports:
            - '${MINIO_PORT:-9000}:9000' # S3 API
            - '${MINIO_CONSOLE_PORT:-9001}:9001' # Web Console
        volumes:
            - minio_data:/data
        healthcheck:
            test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
            interval: 10s
            timeout: 5s
            retries: 5

    # ─────────────────────────────────────────
    # PHP App — Laravel Application (web + Vite)
    # ─────────────────────────────────────────
    app:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: simpas_app
        restart: unless-stopped
        # `serve --no-reload`: tanpa itu `artisan serve` membuang environment di bawah dan hanya membaca .env.
        command: ['composer', 'run', 'dev:docker']
        ports:
            - '${APP_PORT:-8000}:8000'
            - '${VITE_PORT:-5173}:5173'
        environment: *laravel-env
        volumes:
            - .:/var/www/html
        # Entrypoint memasang vendor/ dan membuat .env + APP_KEY; service lain menunggu ini.
        healthcheck:
            test: ['CMD-SHELL', 'test -f vendor/autoload.php && grep -q "^APP_KEY=base64:" .env']
            interval: 5s
            timeout: 3s
            retries: 120
        depends_on:
            postgres:
                condition: service_healthy
            dragonfly:
                condition: service_healthy

    # ─────────────────────────────────────────
    # Queue — broadcast RT1 diantrekan (W169), notifikasi, ekspor
    # ─────────────────────────────────────────
    queue:
        <<: *laravel-worker
        container_name: simpas_queue
        command: ['queue:listen', '--tries=1']

    # ─────────────────────────────────────────
    # Reverb — WebSocket untuk RT1 (logout seketika, kehadiran langsung)
    # ─────────────────────────────────────────
    reverb:
        <<: *laravel-worker
        container_name: simpas_reverb
        command: ['reverb:start', '--host=0.0.0.0', '--port=8080']
        ports:
            - '${REVERB_PORT:-8080}:8080'

    # ─────────────────────────────────────────
    # Scheduler — routes/console.php (pengingat periode, prune ekspor)
    # ─────────────────────────────────────────
    scheduler:
        <<: *laravel-worker
        container_name: simpas_scheduler
        command: ['schedule:work']

volumes:
    postgres_data:
        driver: local
    dragonfly_data:
        driver: local
    minio_data:
        driver: local
